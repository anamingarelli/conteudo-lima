<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário HTML</title>
</head>
<body>
    <h1> 
        Cadastro Cliente
    </h1>
    <form action="">
        <label for="nome">
            Nome:
        </label>
        <br>
        <input type="text"
        id="nome"
        name="nome">
        <br><br>
        <label for="email">
            E-mail:
        </label>
        <br>
        <input type="email"
        id="email"
        name="email">
        <br><br>
        <label for="idade">
            Idade:
        </label>
        <br>
        <input type="number"
        id="idade"
        name="Idade">
        <br><br>
        <button type="submit">
            Cadastrar
        </button>

    </form>
</body>
</html>
