<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify</title>
    <style>
        .navbar-gamer{
            /* Ativa o FLexbox para o elemento pai header */
            display: flex;
            /* Coloca o primeiro filho <div> na esquerda e o outro filho <nav> a direita */
            justify-content: space-between;
            align-items: center;

        }
    </style>
</head>
<body>
    <header class="navbar-gamer">
        <div class="logo">Dev.games</div>
        <nav class="menu-links">
            <a href="">Inicio</a>
            <a href="">Catalogo</a>
            <a href="">Perfil</a>
        </nav>

    </header>
    
</body>
</html>
