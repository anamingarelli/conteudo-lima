<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Aumentando a altura da página, em relação a viewport */
        body{
            height: 300vh;
        }

        .container{

            margin-top: 20vh;
            /* Positions testados:
            position fixed
            position relative
            position static
            position absolute
            postion sticky */
            position: relative;

            top: 30px;
            background-color: blueviolet;
            width: 400px;
            height: 400px;
        }

        .box{
            
            top: 30px;
            left: 30px;
            position: absolute;
            width: 200px;
            height: 200px;
            background-color: black;
        }

        img{
            height: 150px;
            width: 150px;
        }
    </style>
</head>
<body>
    <!-- Div Pai e Div Filha -->
    <div class="container">
        <div class="box">
            <img src="imagem_cabrito.jpg" alt="">
        </div>
    </div>
</body>
</html>
