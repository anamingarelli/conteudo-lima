<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seletores</title>
    <style>
        /* Estilizando com Tag */
        p{
            color:#475569;
            font-size: 16 px;
            background-color: aquamarine;
        }
        /* Estilizando com Class */
        .card-alerta{
            border-left: 4px solid rgb(255, 179, 211);
        }
        /* Estilizando com ID */
        #player-principal{
            background-color: #fef08a;
        }

    </style>
</head>
<body> 
    <!-- esse paragrafo é apenas a tag P -->
    <p>
        Bob Esponja
    </p> 
    <!-- Ess paragrafo contem una class -->
    <p class="card-alerta">
        Minions
    </p>  
    <!-- esse paragrafo contém um ID -->
    <p class="card-alerta" id="player-principal">
        Bibble
    </p>
</body>
</html>
